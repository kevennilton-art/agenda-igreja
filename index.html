<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b4b8a">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Agenda da Igreja</title>
</head>
<body>
  <header>
    <h1>Agenda da Igreja</h1>
    <div id="usuario-barra" hidden>
      <span id="usuario-email"></span>
      <button id="btn-sair" type="button">Sair</button>
    </div>
  </header>

  <main>
    <p id="carregando">Carregando...</p>

    <section id="tela-login" hidden>
      <h2>Entrar</h2>
      <form id="form-login">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>

        <button type="submit" id="btn-entrar">Entrar</button>
        <button type="button" id="btn-esqueci" class="link">Esqueci minha senha</button>
      </form>
      <p id="mensagem" role="alert"></p>
    </section>

    <section id="tela-app" hidden>
      <div id="calendario"></div>
      <div id="dia-detalhe">
        <h3 id="dia-titulo"></h3>
        <p id="dia-eventos">Nenhum evento neste dia.</p>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
